<text x="89" y="751" fill="#5F6D83" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">调用 run_subagent，传入完整任务上下文</text>
<rect x="826" y="225" width="550" height="576" rx="18" fill="#FFFFFF" stroke="#D8DFEB" stroke-width="2"/>
<text x="852" y="249" fill="#17233B" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="30" font-weight="600" dominant-baseline="text-before-edge">可选通用成员模板</text>
<text x="856" y="320" fill="#3459CA" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge">Limo</text>
<text x="970" y="320" fill="#17233B" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="26" font-weight="400" dominant-baseline="text-before-edge">需求与架构</text>
<text x="856" y="397" fill="#3459CA" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge">Peter</text>
<text x="970" y="397" fill="#17233B" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="26" font-weight="400" dominant-baseline="text-before-edge">后端与领域逻辑</text>
<text x="856" y="474" fill="#3459CA" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge">Tom</text>
<text x="970" y="474" fill="#17233B" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="26" font-weight="400" dominant-baseline="text-before-edge">前端与交互</text>
<text x="856" y="551" fill="#3459CA" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge">Kare</text>
<text x="970" y="551" fill="#17233B" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="26" font-weight="400" dominant-baseline="text-before-edge">视觉与动画素材</text>
<text x="856" y="628" fill="#3459CA" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge">Alice</text>
<text x="970" y="628" fill="#17233B" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="26" font-weight="400" dominant-baseline="text-before-edge">独立审查与验收</text>
<text x="852" y="729" fill="#5F6D83" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">示例未绑定本机模型渠道，导入后可自行配置。</text>
<text x="66" y="850" fill="#5F6D83" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">关闭派生 = 叶子代理；数量上限只约束走 run_subagent 的直接下级。</text>
</svg>
